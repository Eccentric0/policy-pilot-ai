services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d enterprise_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  postgres_data:
