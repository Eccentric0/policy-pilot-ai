[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-expense-agent"
version = "0.1.0"
description = "企业制度与报销助手：LangGraph + MCP + RAG + Evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "langgraph>=0.2,<2",
  "mcp>=1.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "reportlab>=4,<5",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
